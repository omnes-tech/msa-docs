info:
    description: Account Abstraction api using Golang KNative
    title: Account Abstraction.
    version: 0.0.1
paths:
    /addError:
        post:
            description: Add an error to the already existing file allAbis
            operationId: AddError
            parameters:
                - description: Filter add error input parameters
                  in: body
                  name: Body
                  required: true
                  schema:
                    $ref: '#/definitions/AddError'
            responses:
                "200":
                    $ref: '#/responses/addErrorResult'
                "400":
                    $ref: '#/responses/errorResponse'
            tags:
                - Events
    /addEvent:
        post:
            description: Add an event to the already existing file allAbis
            operationId: AddEvent
            parameters:
                - description: Filter events input parameters
                  in: body
                  name: Body
                  required: true
                  schema:
                    $ref: '#/definitions/AddEvent'
            responses:
                "200":
                    $ref: '#/responses/addEventsResult'
                "400":
                    $ref: '#/responses/errorResponse'
            tags:
                - Events
    /check:
        post:
            description: Checks if a wallet exists based on the salt given
            operationId: CheckWallet
            parameters:
                - description: Check Wallet input parameters
                  in: body
                  name: Body
                  required: true
                  schema:
                    $ref: '#/definitions/CheckAccounts'
            responses:
                "200":
                    $ref: '#/responses/CheckResult'
                "400":
                    $ref: '#/responses/errorResponse'
            tags:
                - Accounts
    /create:
        post:
            description: Create a new account based on the specified salt
            operationId: CreateAccount
            parameters:
                - description: Create account input parameters
                  in: body
                  name: Body
                  required: true
                  schema:
                    $ref: '#/definitions/CreateAccounts'
            responses:
                "200":
                    $ref: '#/responses/CreateResult'
                "400":
