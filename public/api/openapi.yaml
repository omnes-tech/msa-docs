definitions:
    AccountInfo:
        description: AccountInfo defines the structure for an API account Info
        properties:
            X:
                items:
                    type: string
                type: array
            "Y":
                items:
                    type: string
                type: array
            legacyWallet:
                description: |-
                    Threshold *big.Int `json:"threshold" validate:"required_if=WalletCustody 3,required_if=WalletCustody 4,omitempty"`
                    The legacy wallet flag
                    Note: Only required if Wallet was created before the MSA upgrade
                example: true
                type: boolean
                x-go-name: LegacyWallet
            passkeyPubKey:
                description: |-
                    The passkey public key in base64 format
                    Note: Only required if Wallet custody is 2 or 4 or 5
                items:
                    type: string
                type: array
                x-go-name: PublicKey
            salt:
                description: |-
                    The Salt to predict the wallet address
                    Note: Only required if Wallet address is empty
                example: example@gmail.com
                type: string
                x-go-name: Salt
            signers:
                description: |-
                    The signers of the validator
                    Note: Only required if Validator type is 3 or 4
                example: "0x000000000000000000000000000000000000dEaD"
                items:
                    type: string
                maxLength: 42
                minLength: 42
                type: array
                x-go-name: Signers
            threshold:
                description: |-
                    Signers []*common.Address `json:"signers" validate:"required_if=WalletCustody 3,required_if=WalletCustody 4,omitempty"`
                    The threshold of the validator
                    Note: Only required if Validator type is 3 or 4
                example: "1"
                type: string
                x-go-name: Threshold
            wallet:
                description: |-
                    The wallet address
                    Note: Only required if salt is empty
                example: "0x000000000000000000000000000000000000dEaD"
                maxLength: 42
                minLength: 42
                type: string
                x-go-name: Wallet
            walletCustody:
                description: The wallet custody classification
                example: 2
                format: int64
                maximum: 5
                minimum: 0
                type: integer
                x-go-name: WalletCustody
        required:
            - walletCustody
        type: object
        x-go-package: github.com/omnes-tech/smart-wallet-api/src/api/dtos
